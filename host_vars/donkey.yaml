---
# Apache on ipv4 only, leave ipv6 for k3s
apache_listen_address: "0.0.0.0"

# Similar for docker; only git.avi.st listens externally (port 2222) so restrict
# that to ipv4
docker_compose_ipv4_ports:
  - file: /home/avi/sites/git/compose.yaml
    bind_address: "0.0.0.0"
    ports: ["10880:3000", "2222:22"]

# k3s then gets the ipv6 interface
# k3s_node_ip is the real public ipv6 address on donkey
# the two cidrs are randomly generated with  https://www.unique-local-ipv6.com/
k3s_node_ip: "2001:41d0:305:2100::7bd"
k3s_cluster_cidr: "fdd9:839d:edf::/56"
k3s_service_cidr: "fdd9:839d:edf:1::/112"

# k3s needs an ipv4 address for egress - to hit old-school ipv4-only endpoints
# like Coralogix :)
# This is the primary ipv4 address on donkey
k3s_node_ip_v4: "91.134.243.132"

# Add Tailscale's address to the SAN for k3s' apiserver cert so we can get
# in on the TS interface. By defaultthis only includes k3s_node_ip
k3s_tls_san:
  - "100.67.57.69"
  - "fd7a:115c:a1e0::2d32:3946"

# At the end we'll download k3s' kubeconfig, but that calls it 'default' and has
# the host as localhost. These are the values we replace that with - a human-friendly
# name for the context, and the Tailscale address we can hit the apiserver on
k3s_kubeconfig_name: "farfaraway"
k3s_kubeconfig_server_host: "100.67.57.69"

# Firewall:
#
# port 2222 is git.avi.st's ssh access
# interface_in: tailscale0 restricts access to k3s' apiserver to tailscale
ufw_rules:
  - { rule: allow, port: "22", proto: tcp }
    { rule: allow, port: "2222", proto: tcp}
  - { rule: allow, port: "80", proto: tcp }
  - { rule: allow, port: "443", proto: tcp }
  - { rule: allow, port: "6443", proto: tcp, interface_in: tailscale0 }
ufw_manage_defaults: true
ufw_enable: true

# My Apache logs are in ~/logs/ which is owned avi:avi, so we stick the
# otelcol user in the 'avi' group to let it read them
otelcol_extra_groups: ["avi"]

otelcol_filelog_pipelines:
  - name: wordpress
    include: ["/home/avi/logs/avi.st.access.log", "/home/avi/logs/avi.st.error.log"]
    application_name: avi.st
    subsystem_name: wordpress
  - name: piwigo
    include: ["/home/avi/logs/pics.access.log", "/home/avi/logs/pics.error.log"]
    application_name: pics.avi.st
    subsystem_name: piwigo
  - name: fellscout
    include: ["/home/avi/logs/fellscout.access.log", "/home/avi/logs/fellscout.error.log"]
    application_name: fellscout
    subsystem_name: proxy
  - name: cubanyetis
    include: ["/home/avi/logs/cubanyetis.access.log", "/home/avi/logs/fellscout.error.log"]
    application_name: cubanyetis
    subsystem_name: cubanyetis
  - name: cx-unused-metrics-finder
    include: ['/home/avi/logs/coralogix-metrics.access.log', '/home/avi/logs/coralogix-metrics.access.log']
    application_name: cx-tools
    subsystem_name: unused-metrics-finder
  - name: cx-quota-rules
    include: ['/home/avi/logs/coralogix-quota-rules.access.log', '/home/avi/logs/coralogix-quota-rules.access.log']
    application_name: cx-tools
    subsystem_name: quota-rules

# No /var/log/syslog to tail any more :(
otelcol_enable_journald: true

# Per-process metrics.
otelcol_hostmetrics_processes_scraper: true
