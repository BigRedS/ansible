---
# donkey: application/subsystem name for host-level telemetry (hostmetrics)
# defaults to the ansible hostname ("donkey") already, so no override needed
# here.

# donkey-config.yaml (the hand-written config this replaces) used
# eu2.coralogix.com, not the coralogix.com in group_vars/all/main.yml -
# override here until that default is confirmed/updated account-wide.
otelcol_coralogix_domain: eu2.coralogix.com

# The wordpress/piwigo/fellscout filelog sources below live under
# /home/avi/logs/, and /home/avi is 750 - otelcol-contrib can't traverse it
# to reach them without being in the avi group.
otelcol_extra_groups: ["avi"]

# Log sources tailed from donkey-config.yaml, each routed to its own
# Coralogix application/subsystem as it was before. Assigned directly
# (not "otelcol_filelog_pipelines + [...]") because the installed
# ansible-core (2.19.4) throws "Recursive loop detected in template" on
# that self-referencing extend pattern - see README's override-pattern
# section for the caveat. Harmless here since the role default is always
# [], so extending it and assigning outright are equivalent anyway.
otelcol_filelog_pipelines:
  - name: wordpress
    include: ["/home/avi/logs/avi.st.access.log", "/home/avi/logs/avi.st.error.log"]
    application_name: avi.st
    subsystem_name: wordpress
  - name: piwigo
    include: ["/home/avi/logs/pics.access.log", "/home/avi/logs/pics.error.log"]
    application_name: pics.avi.st
    subsystem_name: piwigo
  - name: fellscout
    include: ["/home/avi/logs/fellscout.access.log", "/home/avi/logs/fellscout.error.log"]
    application_name: fellscout
    subsystem_name: proxy
  - name: cubanyetis
    include: ["/home/avi/logs/cubanyetis.access.log", "/home/avi/logs/fellscout.error.log"]
    application_name: cubanyetis
    subsystem_name: cubanyetis
  - name: cx-unused-metrics-finder
    include: ['/home/avi/logs/coralogix-metrics.access.log', '/home/avi/logs/coralogix-metrics.access.log']
    application_name: cx-tools
    subsystem_name: unused-metrics-finder
  - name: cx-quota-rules
    include: ['/home/avi/logs/coralogix-quota-rules.access.log', '/home/avi/logs/coralogix-quota-rules.access.log']
    application_name: cx-tools
    subsystem_name: quota-rules
    

# donkey has no /var/log/syslog or /var/log/auth.log (journald-only, no
# rsyslog) - ship the journal directly instead of tailing flat files.
otelcol_enable_journald: true

# Per-process metrics.
otelcol_hostmetrics_processes_scraper: true

# Not carried over from donkey-config.yaml (out of scope for the current
# otelcol role - metrics + logs pipelines only, via hostmetrics + filelog):
# - the syslog (rfc5424/TCP) receiver feeding fellscout logs over the network
# - the otlp receiver
# - hostmetrics tuning beyond the "processes" scraper toggle (10s interval,
#   paging/system scrapers, load.cpu_average)
# - the hardcoded host.name: swamp override - host.name is now always set to
#   the ansible hostname ("donkey") instead
