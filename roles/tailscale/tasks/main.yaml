---
# Every host here already has Tailscale installed by hand (or via their own
# install.sh) - which already set up an apt source of its own, typically
# signed-by /usr/share/keyrings/tailscale-archive-keyring.gpg. Don't add a
# second, differently-keyed source for the same repo URL - apt hard-errors
# on that ("Conflicting values set for option Signed-By"). Only add our own
# repo config on the rare host that doesn't have one yet.
- name: Check for an existing Tailscale apt source
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "tailscale*"
  register: tailscale_apt_sources

- name: Map distribution to Tailscale's apt repo naming
  ansible.builtin.set_fact:
    tailscale_repo_os: "{{ ansible_distribution | lower }}"
    tailscale_repo_release: "{{ ansible_distribution_release }}"
  when: tailscale_apt_sources.matched == 0

- name: Ensure prerequisite packages for adding apt repos are present
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
  become: true
  when: tailscale_apt_sources.matched == 0

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  when: tailscale_apt_sources.matched == 0

- name: Download the Tailscale apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ tailscale_repo_os }}/{{ tailscale_repo_release }}.noarmor.gpg"
    dest: /etc/apt/keyrings/tailscale.gpg
    mode: "0644"
  become: true
  when: tailscale_apt_sources.matched == 0

- name: Add Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/tailscale.gpg] https://pkgs.tailscale.com/stable/{{ tailscale_repo_os }} {{ tailscale_repo_release }} main"
    filename: tailscale
  become: true
  when: tailscale_apt_sources.matched == 0

# NOTE: on a host reached over its Tailscale IP/MagicDNS name (e.g. x1 in
# inventory/hosts.yaml), apt upgrading this package can restart tailscaled
# and briefly drop the very SSH connection ansible is using. Usually
# recovers in a second or two once tailscaled reconnects, but see README's
# safety note before running unattended against such a host.
- name: Install/upgrade Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: latest
    update_cache: true
  become: true
