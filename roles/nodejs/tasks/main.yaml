---
- name: Ensure prerequisite packages for adding apt repos are present
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
  become: true

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Download and dearmor the NodeSource apt signing key
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
  args:
    creates: /etc/apt/keyrings/nodesource.gpg
    executable: /bin/bash
  become: true

- name: Add NodeSource apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ nodejs_major_version }}.x nodistro main"
    filename: nodesource
  become: true

- name: Install Node.js (includes npm/npx)
  ansible.builtin.apt:
    name: nodejs
    state: latest
    update_cache: true
  become: true
