---
# The user whose dotfiles chezmoi manages on this host - deliberately NOT
# defaulted to ansible_user: that's the connection user (the ansible_svc_user
# service account as of 2026-09), not necessarily a human with dotfiles.
# Must be set explicitly per-host alongside chezmoi_source_repo below.
chezmoi_user: ""

# Leave unset (the default) to only ensure the chezmoi binary is installed,
# without touching any existing chezmoi state. Set this per-host once you
# want ansible to (re)initialise chezmoi from a source repo:
# chezmoi_source_repo: git@github.com:example/dotfiles.git
chezmoi_source_repo: ""
