---
# Installs the chezmoi binary once; doesn't auto-upgrade it. Delete
# /usr/local/bin/chezmoi on a host if you want this to reinstall/upgrade.
- name: Install chezmoi binary
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://get.chezmoi.io | sh -s -- -b /usr/local/bin
  args:
    creates: /usr/local/bin/chezmoi
    executable: /bin/bash
  become: true

# Only runs the very first time (guarded by the chezmoi source dir not
# existing yet), so it never fights with dotfiles edits made by hand later.
- name: Fail loudly if chezmoi_source_repo is set without chezmoi_user
  ansible.builtin.assert:
    that: chezmoi_user | length > 0
    fail_msg: "chezmoi_source_repo is set but chezmoi_user isn't - set both together (see defaults/main.yaml)."
  when: chezmoi_source_repo | length > 0

- name: Initialise chezmoi from source repo
  ansible.builtin.command: >
    chezmoi init --apply {{ chezmoi_source_repo }}
  args:
    creates: "/home/{{ chezmoi_user }}/.local/share/chezmoi"
  become: true
  become_user: "{{ chezmoi_user }}"
  when: chezmoi_source_repo | length > 0
