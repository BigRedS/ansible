---
# Rules are always applied (allow rules are additive/non-destructive).
# Extend per-host with the self-reference pattern, e.g.:
#   ufw_rules: "{{ ufw_rules + [{'rule': 'allow', 'port': '8080', 'proto': 'tcp'}] }}"
ufw_rules:
  - rule: allow
    port: "22"
    proto: tcp

# These two are the "destructive" bits: setting default-deny and actually
# enabling ufw on a host that may already have its own firewall setup.
# Left off by default so adding this role to a host is a no-op until you
# deliberately opt that host in.
ufw_manage_defaults: false
ufw_default_incoming: deny
ufw_default_outgoing: allow
ufw_enable: false
