#
# Add real hosts here, e.g.:
#
# all:
#   children:
#     linux_boxes:
#       hosts:
#         desktop.example.internal:
#         laptop.example.internal:
#           ansible_user: avi
#
all:
  children:
    linux_boxes:
      hosts:
        donkey:
          ansible_host: donkey.avi.st
        swamp:
